<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Streaming MVP — Em alta</title>

  <!--
    Preconnect aos domínios da TMDB (API + CDN de imagens).
    POR QUÊ: economiza o handshake DNS+TLS antes do JS rodar,
    melhorando o LCP (Largest Contentful Paint) das capas.
  -->
  <link rel="preconnect" href="https://api.themoviedb.org" crossorigin />
  <link rel="preconnect" href="https://image.tmdb.org" crossorigin />

  <!--
    FASE 6.1 — Persistência via Supabase.
    Preconnect ao endpoint do projeto reduz latência da primeira request.
  -->
  <link rel="preconnect" href="https://oxgibqccznmysncubkct.supabase.co" crossorigin />

  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <a class="skip-link" href="#catalog">Pular para o catálogo</a>

  <header class="topbar">
    <div class="topbar__inner">
      <h1 class="brand">
        <img src="logo.png" alt="YverFlix" class="brand__img" />
      </h1>

      <!--
        Barra de busca (Fase 3).
        - role="search" + aria-label no input → acessibilidade.
        - type="search" → no Chrome/Safari, ESC limpa o input nativamente.
        - autocomplete="off" → não polui o histórico do browser.
        - O <button> de limpar é mostrado/ocultado pelo JS (atributo hidden).
        - O submit do form não recarrega a página (preventDefault no JS) —
          a busca é guiada pelo evento 'input' com debounce.
      -->
      <form class="search" role="search" id="search-form" autocomplete="off">
        <span class="search__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m20 20-3.5-3.5"></path>
          </svg>
        </span>
        <input type="search"
               id="search-input"
               class="search__input"
               placeholder="Buscar filmes e séries…  ( / )"
               aria-label="Buscar filmes e séries"
               autocomplete="off"
               spellcheck="false" />
        <button type="button"
                id="search-clear"
                class="search__clear"
                aria-label="Limpar busca"
                hidden>×</button>
        <div id="search-suggestions" class="search-suggestions" role="listbox" hidden></div>
      </form>

      <!--
        FASE 7.1 — Auth do header.
        Estado controlado pelo JS via onAuthStateChange:
          - Deslogado: mostra "Entrar" (botão accent que abre o modal)
          - Logado:    mostra "<email curto> ▾" + dropdown com "Sair"

        Hidden até o cliente Supabase carregar (evita flash de "Entrar"
        seguido por "user@email.com" quando a sessão persistida no
        localStorage chega via INITIAL_SESSION).
      -->
      <div class="auth-header" id="auth-header" hidden>
        <button type="button"
                class="auth-header__btn auth-header__btn--login"
                id="auth-login-btn"
                hidden>
          Entrar
        </button>

        <div class="auth-header__user" id="auth-header-user" hidden>
          <span class="auth-header__email" id="auth-header-email"></span>
          <button type="button"
                  class="auth-header__btn auth-header__btn--logout"
                  id="auth-logout-btn"
                  aria-label="Sair da conta">
            Sair
          </button>
        </div>
      </div>
    </div>
  </header>

  <!--
    Filtros por gênero (Fase 4).
    Carregados uma vez via /genre/movie/list. Click em um chip filtra por
    gênero (endpoint /discover/movie). Click no chip ATIVO desativa e
    volta para Trending.
  -->
  <nav class="filters" aria-label="Filtros por gênero">
    <div class="filters__inner">
      <div id="genres-chips" class="chips"
           role="listbox" aria-label="Gêneros" aria-busy="true"></div>
    </div>
  </nav>

  <main id="catalog" class="page">
    <!--
      FASE 8 — "Continuar Assistindo".
      Carrossel horizontal acima da Minha Lista. Mostra os 10 últimos
      itens com play em watch_history (order by updated_at desc).

      Cada card carrega um data-resume="<season>:<episode>" pra que o
      click abra o ContentModal direto no player view com o S/E salvo
      (deep linking).

      Sync real-time: escuta `yverflix:history-changed` (disparado pelo
      HistoryService no upsert) e aplica patch incremental — move pro
      topo + atualiza badge S/E. Igual padrão do MyList.
    -->
    <section id="continue-section"
             class="section section--rail"
             aria-labelledby="continue-title"
             hidden>
      <div class="section__head">
        <h2 id="continue-title" class="section__title">Continuar Assistindo</h2>
        <p class="section__sub">De onde você parou</p>
      </div>

      <div id="continue-list" class="rail" role="list"
           aria-label="Itens em andamento"></div>
    </section>

    <!--
      FASE 6.3 — "Minha Lista".
      Carrossel horizontal acima do Trending, com os favoritos do usuário.

      A section começa hidden e o JS revela quando há ao menos 1 favorito
      (requisito: estado vazio = display:none pra UI ficar limpa).

      O conteúdo é mantido reativo via CustomEvent('yverflix:favorites-changed')
      disparado pelo módulo Favorites no toggle. O MyList aplica patches
      incrementais (insertBefore / element.remove) — sem re-render do site.
    -->
    <section id="my-list-section"
             class="section section--rail"
             aria-labelledby="my-list-title"
             hidden>
      <div class="section__head">
        <h2 id="my-list-title" class="section__title">Minha Lista</h2>
        <p class="section__sub">Os títulos que você favoritou</p>
      </div>

      <div id="my-list" class="rail" role="list"
           aria-label="Itens favoritados"></div>
    </section>

    <section aria-labelledby="trending-title" class="section">
      <div class="section__head">
        <h2 id="trending-title" class="section__title">Em alta nesta semana</h2>
        <p class="section__sub">Filmes e séries mais populares no momento</p>
      </div>

      <!--
        Root onde o JS renderiza os cards.
        aria-busy/aria-live garantem que leitores de tela
        anunciem mudanças de estado (loading → ready).
      -->
      <div id="grid" class="grid" role="list"
           aria-busy="true" aria-live="polite"></div>

      <!--
        Spinner inferior (Fase 4) — visível APENAS durante o carregamento
        de páginas adicionais (page >= 2). Para o primeiro page, o estado
        de loading usa skeletons no próprio grid.
      -->
      <div id="grid-loadmore" class="grid__loadmore" aria-live="polite" hidden>
        <span class="spinner" aria-hidden="true"></span>
        <p class="grid__loadmore-text">Carregando mais…</p>
      </div>

      <!--
        Sentinel do IntersectionObserver para infinite scroll.
        Invisível (height: 1px). Quando entra na viewport (com rootMargin
        de 400px), o JS dispara loadMore() — desde que não esteja já
        carregando e ainda haja mais páginas (state.hasMore).
      -->
      <div id="grid-sentinel" class="grid__sentinel" aria-hidden="true"></div>
    </section>
  </main>

  <footer class="footer">
    <p>Dados fornecidos por <a href="https://www.themoviedb.org/" target="_blank" rel="noopener">TMDB</a>.</p>
  </footer>

  <!--
    <template> com a estrutura do card.
    POR QUÊ usar <template> em vez de gerar HTML por string:
      1) O HTML é parseado UMA vez; cada card é apenas cloneNode (rápido).
      2) Markup fica junto da view → mais fácil de manter/estilar.
      3) Vamos preencher com textContent → seguro contra XSS no título.
  -->
  <template id="card-template">
    <article class="card" role="listitem" tabindex="0">
      <div class="card__poster-wrap">
        <img class="card__poster"
             alt=""
             loading="lazy"
             decoding="async"
             width="342" height="513" />
        <span class="card__rating" aria-hidden="true"></span>
      </div>
      <div class="card__body">
        <h3 class="card__title"></h3>
        <p class="card__meta"></p>
      </div>
    </article>
  </template>

  <!--
    Modal de Conteúdo (FASE 6 — refatorado).

    Tem DUAS views alternáveis sem fechar o modal:
      .modal__view--details : hero + sinopse + elenco + episódios/play
      .modal__view--player  : iframe (criado lazy ao acionar play)

    A view ativa é controlada pela classe no #player-modal:
      .modal--view-details (default)  → details visível, player hidden
      .modal--view-player              → player visível, details hidden

    O <iframe> NÃO está aqui — é criado dinamicamente quando o usuário
    clica em "Assistir agora" ou em um episódio (REQUISITO 5 — gatilho
    de play). Voltar para details destrói o iframe (libera banda).

    Botão de Voltar (.modal__back) só aparece quando view === 'player'.
  -->
  <div id="player-modal" class="modal modal--view-details" role="dialog"
       aria-modal="true" aria-hidden="true"
       aria-labelledby="player-title">
    <div class="modal__backdrop" data-modal-close aria-hidden="true"></div>

    <div class="modal__panel" role="document">
      <header class="modal__header">
        <!--
          Botão Voltar (FASE 6).
          - Hidden por default; o JS revela quando view === 'player'.
          - Click → volta pra view 'details' SEM fechar o modal.
        -->
        <button type="button"
                class="modal__back"
                id="modal-back"
                hidden
                aria-label="Voltar para os detalhes">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
               stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 18-6-6 6-6"></path>
          </svg>
          <span>Voltar</span>
        </button>

        <h2 id="player-title" class="modal__title">Detalhes</h2>

        <!--
          Botão Favoritar (FASE 6.2).
          - Posicionado entre o título e o botão fechar (requisito).
          - Estados: disabled+spinner (carregando), outline (não fav),
            filled (fav). Toggle em runtime via classes do JS.
          - aria-pressed reflete o estado real (acessibilidade).
          - Hidden em view='player' (modal__back assume aquele slot
            visualmente — mantemos o coração só na tela de detalhes).
          - O <svg> serve aos dois estados — preenchimento controlado
            por CSS (.modal__fav--active fill=currentColor).
        -->
        <button type="button"
                class="modal__fav"
                id="modal-fav"
                hidden
                disabled
                aria-pressed="false"
                aria-label="Adicionar aos favoritos">
          <svg class="modal__fav-icon" viewBox="0 0 24 24" width="20" height="20"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
          </svg>
          <span class="modal__fav-spinner" aria-hidden="true"></span>
          <span class="visually-hidden modal__fav-label">Favoritar</span>
        </button>

        <button type="button"
                class="modal__close"
                data-modal-close
                aria-label="Fechar (ESC)">
          <span aria-hidden="true">×</span>
        </button>
      </header>

      <div class="modal__views">
        <!--
          VIEW 1 — Detalhes Imersivos (default ao abrir).
          Conteúdo (hero + cast + episodes/watch) é populado pelo JS em
          DetailsView.mount(). O wrapper #details-content recebe o DOM.
        -->
        <section id="details-view"
                 class="modal__view modal__view--details"
                 aria-label="Detalhes do conteúdo">
          <div id="details-loading" class="modal__loading"
               role="status" aria-live="polite" hidden>
            <span class="spinner" aria-hidden="true"></span>
            <p>Carregando detalhes…</p>
          </div>
          <div id="details-content" class="details">
            <!-- hero + info + cast + episodes/watch injetados pelo JS -->
          </div>
        </section>

        <!--
          VIEW 2 — Player.
          iframe injetado em #player-mount somente quando o usuário
          aciona play. Sair desta view destrói o iframe (corta banda).

          Fallback silencioso: BetterFlix (padrão) → WarezCDN (8s timeout).
        -->
        <section id="player-view"
                 class="modal__view modal__view--player"
                 aria-label="Player de vídeo"
                 hidden>
          <div id="player-mount" style="width: 100%; height: calc(100vh - 60px); background: #000;"></div>
        </section>
      </div>
    </div>
  </div>

  <!--
    FASE 7.1 — Modal de autenticação (Email/Senha).
    Inputs com type=email/password (browser valida basics + autofill).
    Tabs Login/Criar Conta compartilham o MESMO form pra reduzir markup.
    `aria-modal=true` + role=dialog + focus trap pelo JS.

    Acessibilidade:
      - aria-labelledby aponta pro título dinâmico
      - role=alert na área de erro (anuncia screen reader na hora)
      - autocomplete=email / current-password / new-password
        (gerenciador de senha pega o hint correto por aba)
  -->
  <div class="auth-modal" id="auth-modal" hidden
       role="dialog"
       aria-modal="true"
       aria-labelledby="auth-modal-title">
    <div class="auth-modal__backdrop" data-auth-close></div>

    <div class="auth-modal__content" role="document">
      <button type="button"
              class="auth-modal__close"
              data-auth-close
              aria-label="Fechar (ESC)">
        <span aria-hidden="true">×</span>
      </button>

      <div class="auth-modal__tabs" role="tablist" aria-label="Modo de autenticação">
        <button type="button"
                role="tab"
                class="auth-modal__tab auth-modal__tab--active"
                id="auth-tab-login"
                aria-selected="true"
                data-auth-mode="login">
          Login
        </button>
        <button type="button"
                role="tab"
                class="auth-modal__tab"
                id="auth-tab-signup"
                aria-selected="false"
                data-auth-mode="signup">
          Criar Conta
        </button>
      </div>

      <h2 class="auth-modal__title" id="auth-modal-title">Entrar na sua conta</h2>

      <!--
        novalidate: desligo a UI nativa do browser pra controlar mensagens
        de erro de forma consistente. Ainda usamos `type=email/password`
        pra o autofill funcionar.
      -->
      <form class="auth-modal__form" id="auth-form" novalidate>
        <div class="auth-field">
          <label for="auth-email" class="auth-field__label">Email</label>
          <input type="email"
                 id="auth-email"
                 class="auth-field__input"
                 name="email"
                 autocomplete="email"
                 spellcheck="false"
                 required
                 aria-describedby="auth-email-error" />
          <p class="auth-field__error" id="auth-email-error" role="alert" hidden></p>
        </div>

        <div class="auth-field">
          <label for="auth-password" class="auth-field__label">Senha</label>
          <input type="password"
                 id="auth-password"
                 class="auth-field__input"
                 name="password"
                 autocomplete="current-password"
                 minlength="8"
                 required
                 aria-describedby="auth-password-error auth-password-hint" />
          <p class="auth-field__hint" id="auth-password-hint">Mínimo 8 caracteres.</p>
          <p class="auth-field__error" id="auth-password-error" role="alert" hidden></p>
        </div>

        <!--
          Banner de erro top-level (network / Supabase). role=alert pra
          tts; class de severidade (rate-limit é amarelo, resto é red).
        -->
        <div class="auth-modal__banner" id="auth-banner" role="alert" hidden></div>

        <button type="submit"
                class="auth-modal__submit"
                id="auth-submit"
                disabled>
          <span class="auth-modal__submit-label" id="auth-submit-label">Entrar</span>
          <span class="auth-modal__submit-spinner" aria-hidden="true"></span>
        </button>
      </form>
    </div>
  </div>

  <!--
    FASE 6.1 — Supabase JS v2 via CDN oficial (UMD bundle).
    Carregado SEM defer e ANTES do nosso app.js (que está com defer)
    pra garantir que o global `supabase` já exista no momento em que
    o app.js executa o `createClient()`.
    Pino na major v2 (jsdelivr resolve pra última 2.x) — atualização
    automática de patch/minor sem quebrar API.
  -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!--
    defer (em vez de type="module") para manter compatível com a
    estrutura simples de 3 arquivos solicitada — funciona via file://
    em alguns browsers e em qualquer servidor estático.
  -->
  <script src="./app.js" defer></script>
</body>
</html>
