<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Streaming MVP — Em alta</title>

  <!--
    Preconnect aos domínios da TMDB (API + CDN de imagens).
    POR QUÊ: economiza o handshake DNS+TLS antes do JS rodar,
    melhorando o LCP (Largest Contentful Paint) das capas.
  -->
  <link rel="preconnect" href="https://api.themoviedb.org" crossorigin />
  <link rel="preconnect" href="https://image.tmdb.org" crossorigin />

  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <a class="skip-link" href="#catalog">Pular para o catálogo</a>

  <header class="topbar">
    <div class="topbar__inner">
      <h1 class="brand">
        <span class="brand__dot" aria-hidden="true"></span>
        Streaming<span class="brand__accent">MVP</span>
      </h1>

      <!--
        Barra de busca (Fase 3).
        - role="search" + aria-label no input → acessibilidade.
        - type="search" → no Chrome/Safari, ESC limpa o input nativamente.
        - autocomplete="off" → não polui o histórico do browser.
        - O <button> de limpar é mostrado/ocultado pelo JS (atributo hidden).
        - O submit do form não recarrega a página (preventDefault no JS) —
          a busca é guiada pelo evento 'input' com debounce.
      -->
      <form class="search" role="search" id="search-form" autocomplete="off">
        <span class="search__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m20 20-3.5-3.5"></path>
          </svg>
        </span>
        <input type="search"
               id="search-input"
               class="search__input"
               placeholder="Buscar filmes e séries…  ( / )"
               aria-label="Buscar filmes e séries"
               autocomplete="off"
               spellcheck="false" />
        <button type="button"
                id="search-clear"
                class="search__clear"
                aria-label="Limpar busca"
                hidden>×</button>
      </form>
    </div>
  </header>

  <!--
    Filtros por gênero (Fase 4).
    Carregados uma vez via /genre/movie/list. Click em um chip filtra por
    gênero (endpoint /discover/movie). Click no chip ATIVO desativa e
    volta para Trending.
  -->
  <nav class="filters" aria-label="Filtros por gênero">
    <div class="filters__inner">
      <div id="genres-chips" class="chips"
           role="listbox" aria-label="Gêneros" aria-busy="true"></div>
    </div>
  </nav>

  <main id="catalog" class="page">
    <section aria-labelledby="trending-title" class="section">
      <div class="section__head">
        <h2 id="trending-title" class="section__title">Em alta nesta semana</h2>
        <p class="section__sub">Filmes e séries mais populares no momento</p>
      </div>

      <!--
        Root onde o JS renderiza os cards.
        aria-busy/aria-live garantem que leitores de tela
        anunciem mudanças de estado (loading → ready).
      -->
      <div id="grid" class="grid" role="list"
           aria-busy="true" aria-live="polite"></div>

      <!--
        Spinner inferior (Fase 4) — visível APENAS durante o carregamento
        de páginas adicionais (page >= 2). Para o primeiro page, o estado
        de loading usa skeletons no próprio grid.
      -->
      <div id="grid-loadmore" class="grid__loadmore" aria-live="polite" hidden>
        <span class="spinner" aria-hidden="true"></span>
        <p class="grid__loadmore-text">Carregando mais…</p>
      </div>

      <!--
        Sentinel do IntersectionObserver para infinite scroll.
        Invisível (height: 1px). Quando entra na viewport (com rootMargin
        de 400px), o JS dispara loadMore() — desde que não esteja já
        carregando e ainda haja mais páginas (state.hasMore).
      -->
      <div id="grid-sentinel" class="grid__sentinel" aria-hidden="true"></div>
    </section>
  </main>

  <footer class="footer">
    <p>Dados fornecidos por <a href="https://www.themoviedb.org/" target="_blank" rel="noopener">TMDB</a>.</p>
  </footer>

  <!--
    <template> com a estrutura do card.
    POR QUÊ usar <template> em vez de gerar HTML por string:
      1) O HTML é parseado UMA vez; cada card é apenas cloneNode (rápido).
      2) Markup fica junto da view → mais fácil de manter/estilar.
      3) Vamos preencher com textContent → seguro contra XSS no título.
  -->
  <template id="card-template">
    <article class="card" role="listitem" tabindex="0">
      <div class="card__poster-wrap">
        <img class="card__poster"
             alt=""
             loading="lazy"
             decoding="async"
             width="342" height="513" />
        <span class="card__rating" aria-hidden="true"></span>
      </div>
      <div class="card__body">
        <h3 class="card__title"></h3>
        <p class="card__meta"></p>
      </div>
    </article>
  </template>

  <!--
    Modal do player (Fase 2).

    Estrutura:
      .modal             → camada full-screen (display:none por CSS quando fechada)
      .modal__backdrop   → fundo blur; clique nele fecha (data-modal-close)
      .modal__panel      → container central com header + body
      .modal__close      → botão "Fechar" sempre visível
      #player-mount      → onde o <iframe> é INJETADO dinamicamente pelo JS

    O <iframe> NÃO existe neste HTML — é criado em PlayerModal.open()
    e completamente removido em PlayerModal.close() (corta áudio/banda).

    aria-hidden="true" inicial; o JS alterna para "false" quando abre.
  -->
  <div id="player-modal" class="modal" role="dialog"
       aria-modal="true" aria-hidden="true"
       aria-labelledby="player-title">
    <div class="modal__backdrop" data-modal-close aria-hidden="true"></div>

    <div class="modal__panel" role="document">
      <header class="modal__header">
        <h2 id="player-title" class="modal__title">Player</h2>
        <button type="button"
                class="modal__close"
                data-modal-close
                aria-label="Fechar player (ESC)">
          <span aria-hidden="true">×</span>
        </button>
      </header>

      <div class="modal__body" id="player-mount">
        <!-- iframe injetado dinamicamente pelo PlayerModal -->
      </div>

      <!--
        Painel de séries (FASE 5).
        Só fica visível quando mediaType === 'tv'. Para filmes, o
        atributo `hidden` permanece e o painel não consome layout.

        Estrutura:
          .episodes              → wrapper (hidden por default)
          .episodes__head        → label + <select> de temporadas
          .episodes__loading     → spinner inline (só durante fetch)
          #episodes-list         → <ul role="listbox"> de episódios

        POR QUÊ um <select> nativo em vez de dropdown custom:
          1) acessibilidade out-of-the-box (teclado, leitores de tela);
          2) zero JS p/ abrir/fechar — performance + simplicidade;
          3) estilizado com `appearance: none` + chevron SVG inline.
      -->
      <aside id="episodes-panel" class="episodes" hidden
             aria-label="Temporadas e episódios">
        <header class="episodes__head">
          <label class="episodes__label" for="season-select">Temporada</label>
          <div class="episodes__select-wrap">
            <select id="season-select"
                    class="episodes__select"
                    aria-controls="episodes-list">
              <!-- options populadas dinamicamente por SeriesEpisodes -->
            </select>
            <span class="episodes__chevron" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none"
                   stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round">
                <path d="m6 9 6 6 6-6"></path>
              </svg>
            </span>
          </div>
        </header>

        <div class="episodes__loading" hidden role="status" aria-live="polite">
          <span class="spinner spinner--sm" aria-hidden="true"></span>
          <span>Carregando episódios…</span>
        </div>

        <ul id="episodes-list" class="episodes__list"
            role="listbox" aria-label="Episódios" aria-busy="false"></ul>
      </aside>
    </div>
  </div>

  <!--
    defer (em vez de type="module") para manter compatível com a
    estrutura simples de 3 arquivos solicitada — funciona via file://
    em alguns browsers e em qualquer servidor estático.
  -->
  <script src="./app.js" defer></script>
</body>
</html>
